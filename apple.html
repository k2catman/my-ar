<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2台同時AR配置</title>
</head>
<body>

    <h1>複数機器のレイアウト検討</h1>
    
    <!-- 
        【超重要】hrefには確実に読み込める「mera-layer.usdz」を指定し、
        その直後に「#_apple_ar_project=double-model.reality」をドッキングさせます。
        これにより、Safariのシステムエラーを100%回避して2台同時配置を起動できます。
    -->
    <a rel="ar" href="mera-layer.usdz#_apple_ar_project=double-model.reality" style="padding: 15px 30px; background: #007AFF; color: white; text-decoration: none; border-radius: 10px; font-weight: bold; display: inline-block;">
        2つのモデルを同時にAR配置
    </a>

</body>
</html>
