<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR機器カタログ</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 40px 20px;
            background-color: #f5f5f7;
            color: #1d1d1f;
        }
        h1 { font-size: 24px; margin-bottom: 30px; }
        
        .catalog-box {
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-width: 320px;
            margin: 0 auto;
        }

        /* 現場で押しやすい大型のAppleスタイルボタン */
        .ar-btn {
            display: block;
            padding: 18px 30px;
            background-color: #0071e3;
            color: white;
            text-decoration: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            transition: background-color 0.2s;
        }
        .ar-btn:active {
            background-color: #0051a2;
        }
    </style>
</head>
<body>

    <h1>AaR機器配置カタログ</h1>

    <div class="catalog-box">
        <!-- 
            【人工心肺】mera-layer.usdz を起動（実寸大固定）
        -->
        <a class="ar-btn" rel="ar" href="mera-layer.usdz#allowsContentScaling=0">
            人工心肺 を配置
        </a>

        <!-- 
            【顕微鏡】zeiss.usdz を起動（実寸大固定）
        -->
        <a class="ar-btn" rel="ar" href="zeiss.usdz#allowsContentScaling=0">
            顕微鏡 を配置
        </a>
    </div>

</body>
</html>
