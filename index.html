<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D CAD ARビューアー</title>
    <style>
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f4f4f4;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        }
        .ar-button {
            display: block;
            padding: 20px 40px;
            font-size: 20px;
            font-weight: bold;
            color: white;
            background-color: #007aff;
            border-radius: 16px;
            text-decoration: none;
            box-shadow: 0 4px 12px rgba(0,122,255,0.3);
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- 
      iPhone専用の100%確実なAR起動リンクです。
      プログラムを一切挟まず、ダイレクトに model.usdz をiPhoneのOSに渡します。
    -->
    <a rel="ar" href="model.usdz">
        <img src="model.usdz" style="display:none;"> <!-- iOSの自動AR認識のための隠しタグ -->
        <span class="ar-button">📱 目の前にARで配置する</span>
    </a>

</body>
</html>
