<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D CAD ARビューアー</title>
    <style>
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f4f4f4;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        }
        .ar-button {
            display: block;
            padding: 20px 40px;
            font-size: 20px;
            font-weight: bold;
            color: white;
            background-color: #007aff;
            border-radius: 16px;
            text-decoration: none;
            box-shadow: 0 4px 12px rgba(0,122,255,0.3);
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- 
      ★ファイル名変更エリア★
      「src="model.usdz"」の「model.usdz」の部分を、GitHubにアップロードした好きなファイル名に書き換えてください。
      (例: src="part_A.usdz" や src="car_model.usdz" など)
    -->
    <a id="ar-link" rel="ar" href="#" type="model/vnd.usdz+zip" data-usdz-src="pen.usdz">
        <span class="ar-button">📱 目の前にARで配置する</span>
    </a>

    <!-- 
      設定されたファイル名をiPhoneへ正しく引き渡すための自動プログラム 
    -->
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const arLink = document.getElementById("ar-link");
            // data-usdz-srcに書かれたファイル名を取得
            const usdzFileName = arLink.getAttribute("data-usdz-src");
            
            // リンク先（href）を自動的にそのファイル名に書き換える
            arLink.href = usdzFileName;
            
            // iOSの自動認識を助ける隠し画像を裏側で生成
            const img = document.createElement("img");
            img.src = usdzFileName;
            img.style.display = "none";
            arLink.appendChild(img);
        });
    </script>

</body>
</html>
