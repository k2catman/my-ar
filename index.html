<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D CAD ARビューアー</title>
    
    <!-- Googleが開発・提供している、最も安定した公式3D/ARライブラリを読み込みます -->
    <script type="module" src="https://googleapis.com"></script>
    
    <style>
        body {
            margin: 0;
            background-color: #f9f9f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        /* 画面いっぱいに3Dビューアーを表示する設定 */
        model-viewer {
            width: 100%;
            height: 100%;
            background-color: #ffffff;
        }
    </style>
</head>
<body>

    <!-- 
        model-viewer要素：
        src: 6.4MBのmodel.glbを指定します。
        ar: ARボタンを自動で表示させます。
        ar-modes: iOS用の「quick-look」を最優先で起動させます。
        camera-controls: 指で触って回転・拡大できるようにします。
    -->
    <model-viewer 
        src="model.glb" 
        ar 
        ar-modes="quick-look webxr scene-viewer" 
        camera-controls 
        touch-action="pan-y"
        alt="CAD 3Dモデル">
    </model-viewer>

</body>
</html>
