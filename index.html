<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D CAD ARビューアー</title>
    <style>
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f0f0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        .ar-button {
            display: inline-block;
            padding: 16px 32px;
            font-size: 18px;
            font-weight: bold;
            color: white;
            background-color: #007aff;
            border-radius: 12px;
            text-decoration: none;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <!-- 
      iPhone専用の公式AR起動リンクです。
      rel="ar" をつけることで、Safariが自動的に「本物のARカメラ」を起動します。
      HIROマーカーなどの紙も一切不要になり、床を認識してモデルが置けます！
    -->
    <a rel="ar" href="model.glb" class="ar-button">
        ARでCADモデルを表示する
    </a>

</body>
</html>
