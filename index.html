<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D CAD ARビューアー</title>
    <style>
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f4f4f4;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        }
        .ar-button {
            display: block;
            padding: 20px 40px;
            font-size: 20px;
            font-weight: bold;
            color: white;
            background-color: #007aff;
            border-radius: 16px;
            text-decoration: none;
            box-shadow: 0 4px 12px rgba(0,122,255,0.3);
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- 
      ★表示したいファイル名の指定エリア★
      data-usdz-src="ここ" を、GitHubにある表示したいファイル名（例: Heart_Lung.usdz や pen.usdz）に書き換えてください。
    -->
    <a id="ar-link" rel="ar" href="#" type="model/vnd.usdz+zip" data-usdz-src="mera-layer.usdz">
        <span class="ar-button">📱 目の前にARで配置する</span>
    </a>

    <!-- 設定されたファイル名をiPhoneへ正しく引き渡すための自動プログラム -->
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const arLink = document.getElementById("ar-link");
            const usdzFileName = arLink.getAttribute("data-usdz-src");
            
            arLink.href = usdzFileName;
            
            const img = document.createElement("img");
            img.src = usdzFileName;
            img.style.display = "none";
            arLink.appendChild(img);
        });
    </script>

</body>
</html>
