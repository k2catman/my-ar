<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D CAD ARカタログビューアー</title>
    <style>
        body {
            margin: 0;
            background-color: #f4f4f4;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* カタログの案内文字 */
        .title {
            font-size: 16px;
            color: #666;
            margin-bottom: 12px;
            font-weight: 500;
        }

        /* 1. 部品を選ぶボタンが並ぶエリア */
        .button-container {
            display: flex;
            gap: 8px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            justify-content: center;
            padding: 0 16px;
        }

        /* 選択ボタンの見た目 */
        .select-btn {
            padding: 10px 20px;
            font-size: 14px;
            font-weight: bold;
            background-color: #ffffff;
            color: #333333;
            border: 2px solid #ddd;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        /* 現在選ばれているボタンの見た目 */
        .select-btn.active {
            background-color: #333333;
            color: #ffffff;
            border-color: #333333;
        }

        /* 2. ARを起動する大きな青いボタン */
        .ar-button {
            display: block;
            padding: 20px 40px;
            font-size: 18px;
            font-weight: bold;
            color: white;
            background-color: #007aff;
            border-radius: 16px;
            text-decoration: none;
            box-shadow: 0 4px 12px rgba(0,122,255,0.3);
            text-align: center;
            transition: transform 0.1s ease;
        }
        .ar-button:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <div class="title">表示したい部品を選択してください</div>

    <!-- 
      ★ボタンを増やす・名前を変えるエリア★
      data-file の後ろに、GitHubにアップロードした .usdz の正確なファイル名を入力します。
      ボタンの数を増やしたい場合は、この行をコピーして下に増やしていくだけで自動で認識されます。
    -->
    <div class="button-container">
        <button class="select-btn active" data-file="Heart_Lung.usdz">部品 A</button>
        <button class="select-btn" data-file="pen.usdz">部品 B</button>
        <button class="select-btn" data-file="part_C.usdz">部品 C</button>
    </div>

    <!-- AR起動用の大元のリンク（中身は下のプログラムで自動書き換えされます） -->
    <a id="ar-link" rel="ar" href="model.usdz" type="model/vnd.usdz+zip">
        <span class="ar-button">📱 選択した部品をARで配置</span>
    </a>

    <!-- ボタンの切り替えを制御するプログラム -->
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const buttons = document.querySelectorAll('.select-btn');
            const arLink = document.getElementById('ar-link');

            // iOSの自動認識を助けるための隠し画像タグを裏側で用意
            const img = document.createElement("img");
            img.style.display = "none";
            arLink.appendChild(img);

            // 最初（初期状態）のファイル名を設定
            img.src = arLink.href;

            // ボタンがクリックされた時の処理
            buttons.forEach(button => {
                button.addEventListener('click', function() {
                    // 1. すべてのボタンから黒い「active」デザインを一度外す
                    buttons.forEach(btn => btn.classList.remove('active'));
                    // 2. 今クリックされたボタンを黒い「active」デザインにする
                    this.classList.add('active');

                    // 3. ボタンに埋め込まれている.usdzファイル名を取得
                    const nextFile = this.getAttribute('data-file');

                    // 4. AR起動リンクと隠し画像のリンクをそのファイル名に書き換える
                    arLink.href = nextFile;
                    img.src = nextFile;
                });
            });
        });
    </script>

</body>
</html>
