<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <title>CAD AR Viewer</title>
    
    <!-- iOSのカメラフリーズバグを修正した、最新かつ最も安定しているバージョンの組み合わせです -->
    <script src="https://aframe.io"></script>
    <script src="https://githack.com"></script>
</head>
<body style="margin: 0; overflow: hidden; -webkit-overflow-scrolling: touch;">

    <!-- 
      iPhoneでのカメラ起動エラーを強制回避するため、
      videoTexture: true（映像を3Dに直接流し込む設定）を追加しました。
    -->
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false; trackingMethod: best; videoTexture: true;" vr-mode-ui="enabled: false">
        
        <!-- 最初にお願いした3Dモデル（model.glb）を表示する設定に戻しています -->
        <a-assets>
            <a-asset-item id="cad-model" src="model.glb"></a-asset-item>
        </a-assets>

        <!-- HIROマーカー -->
        <a-marker preset="hiro">
            
            <!-- 
                CADデータは実寸大で巨大になりやすいため、scale（大きさ）を「0.01（100分の1）」まで小さくしています。
                もし映したときに小さすぎたら「0.05」などに数値を上げて調整してください。
            -->
            
            

        </a-marker>

        

    </a-scene>

</body>
</html>
