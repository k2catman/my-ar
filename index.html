<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <title>AR.js 互換性テスト</title>
    <!-- バグの少ない A-Frame 1.3.0 と 最新の AR.js を読み込み -->
    <script src="https://aframe.io"></script>
    <script src="https://githack.com"></script>
</head>
<body style="margin: 0; overflow: hidden;-webkit-overflow-scrolling: touch;">

    <!-- 
        iOSでのカメラ起動不具合を防ぐため、
        videoTexture: true などの互換性オプションを明示的に指定 
    -->
    <a-scene embedded 
             arjs="sourceType: webcam; debugUIEnabled: false; videoTexture: true;" 
             renderer="logarithmicDepthBuffer: true;">
        
        <!-- テスト用の標準 hiro マーカー -->
        <a-marker preset="hiro">
            <a-box position="0 0.5 0" material="color: red;"></a-box>
        </a-marker>

        
    </a-scene>

</body>
</html>
