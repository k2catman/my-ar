<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D CAD ARカタログビューアー</title>
    <style>
        body {
            margin: 0;
            background-color: #f4f4f4;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .title {
            font-size: 16px;
            color: #666;
            margin-bottom: 12px;
            font-weight: 500;
        }
        .button-container {
            display: flex;
            gap: 8px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            justify-content: center;
            padding: 0 16px;
        }
        .select-btn {
            padding: 10px 20px;
            font-size: 14px;
            font-weight: bold;
            background-color: #ffffff;
            color: #333333;
            border: 2px solid #ddd;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .select-btn.active {
            background-color: #333333;
            color: #ffffff;
            border-color: #333333;
        }
        .ar-button {
            display: block;
            padding: 20px 40px;
            font-size: 18px;
            font-weight: bold;
            color: white;
            background-color: #007aff;
            border-radius: 16px;
            text-decoration: none;
            box-shadow: 0 4px 12px rgba(0,122,255,0.3);
            text-align: center;
            transition: transform 0.1s ease;
        }
        .ar-button:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <div class="title">表示したい部品を選択してください</div>

    <!-- ボタンエリア（文字を「部品A」から実際の名称に変更することも可能です） -->
    <div class="button-container">
        <button class="select-btn active" data-file="Heart_Lung.usdz">部品 A</button>
        <button class="select-btn" data-file="pen.usdz">部品 B</button>
        <button class="select-btn" data-file="part_C.usdz">部品 C</button>
    </div>

    <!-- 
      【修正箇所】
      href="#" に変更し、404エラーを防止しました。
      最初から選ばれている「部品A」のファイルを自動でセットする仕組みにしています。
    -->
    <a id="ar-link" rel="ar" href="#" type="model/vnd.usdz+zip">
        <span class="ar-button">📱 選択した部品をARで配置</span>
    </a>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const buttons = document.querySelectorAll('.select-btn');
            const arLink = document.getElementById('ar-link');

            // iOS用の隠し画像タグを生成
            const img = document.createElement("img");
            img.style.display = "none";
            arLink.appendChild(img);

            // ページが開いた瞬間、一番最初の「active」がついているボタンのファイル名を自動セット
            const initialActiveBtn = document.querySelector('.select-btn.active');
            if (initialActiveBtn) {
                const firstFile = initialActiveBtn.getAttribute('data-file');
                arLink.href = firstFile;
                img.src = firstFile;
            }

            // ボタンがクリックされた時の切り替え処理
            buttons.forEach(button => {
                button.addEventListener('click', function() {
                    buttons.forEach(btn => btn.classList.remove('active'));
                    this.classList.add('active');

                    const nextFile = this.getAttribute('data-file');
                    arLink.href = nextFile;
                    img.src = nextFile;
                });
            });
        });
    </script>

</body>
</html>
